<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Placement OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-start: #EBF3FC;
      --bg-mid:   #F3F7FD;
      --bg-end:   #F8FAFC;
      --card-bg:  rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.95);
      --border: rgba(0, 0, 0, 0.08);
      --border-focus: #3B82F6;
      --text: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --shadow-card: 0 20px 45px -10px rgba(37, 99, 235, 0.12), 0 8px 16px -6px rgba(15, 23, 42, 0.04);
      --input-bg: #F8FAFC;
      --input-border: #E2E8F0;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-mid) 45%, #F5F3FF 75%, var(--bg-end) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient soft background orbs (pure CSS, lightweight, no CPU spikes) */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      top: -80px;
      left: 10%;
      background: radial-gradient(circle, #BAE6FD 0%, rgba(186, 230, 253, 0) 70%);
    }

    .orb-2 {
      width: 460px;
      height: 460px;
      bottom: -100px;
      right: 12%;
      background: radial-gradient(circle, #C7D2FE 0%, rgba(199, 210, 254, 0) 70%);
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      top: 40%;
      right: 25%;
      background: radial-gradient(circle, #E0E7FF 0%, rgba(224, 231, 255, 0) 70%);
      opacity: 0.4;
    }

    /* Main container */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: auto;
      animation: enterCard 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes enterCard {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Glassmorphism Card */
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--shadow-card);
      padding: 2.5rem 2.25rem;
      text-align: center;
    }

    /* Brand Logo / Icon Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .brand-icon-wrapper {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .brand-icon-glow {
      position: absolute;
      inset: -6px;
      background: linear-gradient(135deg, #38BDF8, #6366F1);
      border-radius: 20px;
      filter: blur(12px);
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    .brand-icon {
      position: relative;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand-header:hover .brand-icon {
      transform: scale(1.05);
    }

    .brand-header:hover .brand-icon-glow {
      opacity: 0.65;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Form Styles */
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.45rem;
      letter-spacing: -0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 42px;
      font-size: 0.94rem;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      background: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--accent);
    }

    /* Toggle Password Button */
    .toggle-password {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--text);
      background-color: rgba(0, 0, 0, 0.04);
    }

    /* Options Row: Remember & Forgot */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.1rem 0 1.5rem 0;
      font-size: 0.84rem;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 4px;
    }

    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .forgot-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.42);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
    }

    .btn-submit svg {
      transition: transform 0.18s ease;
    }

    .btn-submit:hover svg {
      transform: translateX(3px);
    }

    /* Footer info */
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.78rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #0F172A;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }
      .brand-title {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient light blobs (pure CSS) -->
  <div class="ambient-glow" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand & Icon -->
      <div class="brand-header">
        <div class="brand-icon-wrapper">
          <div class="brand-icon-glow"></div>
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
        </div>
        <h1 class="brand-title">Placement OS</h1>
        <p class="brand-subtitle">Enter your credentials to access your dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        
        <!-- Email / Username -->
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="loginEmail" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com" 
              required
              autocomplete="username"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="loginPassword" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me & Forgot password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgotPwdLink">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

      <!-- Secure cloud sync status footer -->
      <div class="footer-note">
        <span class="status-dot"></span>
        <span>Secure connection · Supabase & PostgreSQL 17</span>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastText">Signed in successfully</span>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("loginEmail");
      const passwordInput = document.getElementById("loginPassword");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const eyeIcon = document.getElementById("eyeIcon");
      const forgotLink = document.getElementById("forgotPwdLink");
      const submitBtn = document.getElementById("submitBtn");
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");

      // Password toggle (show/hide)
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");

        if (isPassword) {
          // Open eye / strike through
          eyeIcon.innerHTML = `
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          `;
        }
      });

      // Forgot password trigger
      forgotLink.addEventListener("click", (e) => {
        e.preventDefault();
        showToast("Password reset link will be sent to your email.");
      });

      // Form submission
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email) {
          emailInput.focus();
          showToast("Please enter your email");
          return;
        }

        if (!password) {
          passwordInput.focus();
          showToast("Please enter your password");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.8";
        submitBtn.innerHTML = `
          <span>Authenticating...</span>
        `;

        showToast("Access granted! Opening dashboard...");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);
      });

      // Toast helper
      let toastTimer = null;
      function showToast(msg) {
        toastText.textContent = msg;
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }
    });
  </script>
</body>
</html>
